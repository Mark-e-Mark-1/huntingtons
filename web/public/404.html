<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Huntington's</title>
    <script>
      (function () {
        var root = "/huntingtons/";
        var parts = location.pathname.split("/").filter(Boolean);
        var known = ["overview", "treatments", "research", "resources", "glossary", "about", "disclaimer"];
        var idx = parts.findIndex(function (p) { return known.indexOf(p) !== -1; });
        if (idx !== -1) {
          location.replace(root + "#/" + parts.slice(idx).join("/") + location.search);
        } else {
          location.replace(root + (location.hash || "#/"));
        }
      })();
    </script>
  </head>
  <body>
    <p><a href="/huntingtons/">Huntington's</a></p>
  </body>
</html>
